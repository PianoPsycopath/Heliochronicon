[project]
name = "heliochronicon-tools"
version = "0.1.0"
description = "Python data-pipeline tooling for Heliochronicon (custom solar system CSV -> JSON conversion)."
requires-python = ">=3.11"
# The pipeline itself has no runtime dependencies — csv/json/pathlib are
# stdlib. Dev tooling is pinned below.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "black==24.10.0",
]

[tool.setuptools.packages.find]
include = ["raw*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/python"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["raw/N-Raw.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
