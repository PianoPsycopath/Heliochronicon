<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <title>Heliochronicon</title>

        <link
            href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css" />
        <link rel="stylesheet" href="css/themes.css" />
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/layout.css" />
        <link rel="stylesheet" href="css/controls.css" />
        <link rel="stylesheet" href="css/chronometer.css" />
        <link rel="stylesheet" href="css/magi.css" />
        <link rel="stylesheet" href="css/tutorial.css" />
        <link rel="stylesheet" href="css/ruler.css" />
        <link rel="stylesheet" href="css/credits.css" />
    </head>
    <body class="boot-active" oncontextmenu="return false;">
        <div id="crt-overlay" aria-hidden="true"></div>
        <div id="magi-boot-container" aria-hidden="true">
            <div id="magi-boot-balthasar" class="magi-boot-panel">
                <span class="magi-boot-label"
                    >CHRONOMETER</span
                >
            </div>
            <div id="magi-boot-casper" class="magi-boot-panel">
                <span class="magi-boot-label"
                    >OCULARIS</span
                >
            </div>
            <div id="magi-boot-melchor" class="magi-boot-panel">
                <span class="magi-boot-label"
                    >SENSORIUM</span
                >
            </div>
        </div>
        <div id="tactical-zoom-ruler">
            <div class="ruler-landmarks" aria-hidden="true">
                <span class="landmark" data-val="0.00000001" title="Galaxy (Deep Space)">
                    <svg viewBox="0 0 24 24">
                        <!-- spiral arms -->
                        <ellipse cx="12" cy="12" rx="10" ry="2.8" transform="rotate(15 12 12)" />
                        <ellipse cx="12" cy="12" rx="10" ry="2.8" transform="rotate(75 12 12)" />
                        <ellipse cx="12" cy="12" rx="10" ry="2.8" transform="rotate(135 12 12)" />
                        <!-- bright core -->
                        <circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none" />
                    </svg>
                </span>

                <span class="landmark" data-val="0.0001" title="Stars">
                    <svg viewBox="0 0 24 24">
                        <polygon
                            points="12,2 14.5,8.5 21.5,8.5 16,13 18,20 12,16 6,20 8,13 2.5,8.5 9.5,8.5"
                            fill="currentColor"
                            stroke="none"
                        />
                    </svg>
                </span>

                <span class="landmark" data-val="2" title="Solar System">
                    <svg viewBox="0 0 24 24">
                        <!-- sun -->
                        <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none" />
                        <!-- orbits -->
                        <circle cx="12" cy="12" r="6" />
                        <circle cx="12" cy="12" r="9.5" />
                        <!-- planets on the rings -->
                        <circle cx="18" cy="12" r="1.1" fill="currentColor" stroke="none" />
                        <circle cx="12" cy="5.5" r="0.9" fill="currentColor" stroke="none" />
                        <circle cx="7.5" cy="16.5" r="0.85" fill="currentColor" stroke="none" />
                    </svg>
                </span>

                <span class="landmark" data-val="50" title="Planet System">
                    <svg viewBox="0 0 24 24">
                        <!-- larger planet body -->
                        <circle cx="12" cy="12" r="5.5" />
                        <!-- ring -->
                        <ellipse cx="12" cy="12" rx="11" ry="3" />
                    </svg>
                </span>

                <span class="landmark" data-val="2000" title="Moon System">
                    <svg viewBox="0 0 24 24">
                        <!-- crescent -->
                        <path
                            d="M14 4
                             A8.5 8.5 0 1 0 14 20
                             A6.5 6.5 0 1 1 14 4Z"
                            fill="currentColor"
                            stroke="none"
                        />
                    </svg>
                </span>

                <span class="landmark" data-val="500000" title="Asteroid Scale">
                    <svg viewBox="0 0 24 24">
                        <polygon points="12,3 18,7 19,14 14,20 7,19 4,12 7,6" />
                        <!-- small crater -->
                        <circle cx="10" cy="11" r="1.2" fill="currentColor" stroke="none" />
                    </svg>
                </span>

                <span class="landmark" data-val="150000000" title="Planetary Surface">
                    <svg viewBox="0 0 24 24">
                        <!-- layered pine foliage -->
                        <polygon points="12,2 7,9 17,9" />
                        <polygon points="12,6 5.5,14 18.5,14" />
                        <polygon points="12,11 4,20 20,20" />
                        <!-- trunk -->
                        <line x1="12" y1="20" x2="12" y2="22.5" />
                    </svg>
                </span>
            </div>
            <div id="ruler-interactive-zone">
                <canvas id="tactical-ruler-canvas" aria-hidden="true"></canvas>
                <input
                    type="range"
                    id="zoom-slider"
                    min="0"
                    max="1000"
                    value="500"
                    aria-label="Zoom level"
                />
            </div>
        </div>
        <div
            id="panel-left"
            class="panel"
            role="complementary"
            aria-labelledby="panel-left-heading"
        >
            <h2 id="panel-left-heading">Ocularis &middot; System Status</h2>
            <p style="color: var(--theme-text-primary); font-weight: bold; margin-bottom: 5px">
                TARGET: <span id="current-target" aria-live="polite" aria-atomic="true">NONE</span>
            </p>
            <div class="tab-nav flex-row" role="tablist" aria-label="System Status views">
                <button
                    id="btn-tab-search"
                    class="tab-btn active"
                    role="tab"
                    aria-selected="true"
                    aria-controls="tab-search"
                    tabindex="0"
                >
                    SEARCH
                </button>
                <button
                    id="btn-tab-vis"
                    class="tab-btn"
                    role="tab"
                    aria-selected="false"
                    aria-controls="tab-visibility"
                    tabindex="-1"
                >
                    VISIBILITY
                </button>
                <button
                    id="btn-tab-settings"
                    class="tab-btn"
                    role="tab"
                    aria-selected="false"
                    aria-controls="tab-settings"
                    tabindex="-1"
                >
                    SETTINGS
                </button>
            </div>

            <div
                id="tab-search"
                class="tab-content active"
                role="tabpanel"
                aria-labelledby="btn-tab-search"
                tabindex="0"
            >
                <div class="control-group" style="margin-top: 10px">
                    <label id="search-label" for="search-input">TACTICAL DATABASE</label>
                    <input
                        type="text"
                        id="search-input"
                        placeholder="SEARCH ALL (TEXT)..."
                        aria-describedby="search-label"
                    />
                    <button
                        id="sort-toggle"
                        class="full-btn"
                        aria-label="Change list sort order, currently sorted by distance"
                    >
                        SORT: DIST
                    </button>
                    <div
                        id="body-list"
                        class="scrollable-list"
                        style="max-height: 50vh"
                        aria-label="Celestial body results"
                    ></div>
                </div>
            </div>

            <!-- TAB 2: VISIBILITY CONTENT -->
            <div
                id="tab-visibility"
                class="tab-content"
                role="tabpanel"
                aria-labelledby="btn-tab-vis"
                tabindex="0"
                hidden
                style="overflow-y: auto; padding-right: 5px"
            >
                <!-- MAGI CIRCUIT BOARD -->
                <div class="control-group magi-board" style="padding: 10px 5px; margin-top: 10px">
                    <div
                        class="magi-header"
                        style="display: flex; justify-content: space-between; margin-bottom: 15px"
                    >
                        <span>SYSTEM VISIBILITY</span>
                        <button
                            id="btn-clear-map"
                            class="danger-btn"
                            style="width: auto; margin: 0; font-size: 0.7rem; padding: 2px 5px"
                            aria-label="Purge memory: remove all loaded datasets"
                        >
                            PURGE MEMORY
                        </button>
                    </div>

                    <!-- TWO-COLUMN CIRCUIT -->
                    <div class="magi-circuit">
                        <!-- ASTEROIDS (LEFT) -->
                        <div class="magi-column left-col">
                            <!-- Master display-mode cycle (Particles / Shapes / Both) -->
                            <button
                                id="btn-master-mode-toggle"
                                type="button"
                                class="magi-mode-toggle mode-particles"
                                style="margin-bottom: 8px"
                                aria-label="Display mode for all asteroid datasets: Particles"
                                aria-pressed="false"
                            >
                                PARTICLES
                            </button>

                            <!-- MASTER OVERRIDE (Root of Asteroid Tree) -->
                            <!-- Sits directly above dataset-list-asteroids (no
                                 element without wire art in between) so this
                                 row's own right-edge stub is what each list
                                 row's upward stub (see VisibilityTreeManager's
                                 magi-svg-wire polyline) visually connects into,
                                 forming one continuous circuit-board trunk. -->
                            <div
                                class="magi-row master-row"
                                id="row-master-toggle"
                                style="margin-bottom: 8px; justify-content: flex-end"
                                role="checkbox"
                                aria-checked="false"
                                aria-label="Toggle visibility of all asteroid datasets"
                                tabindex="0"
                            >
                                <div class="magi-btn">
                                    <div
                                        class="magi-status"
                                        style="width: 100%; justify-content: center"
                                    >
                                        <span
                                            class="magi-label"
                                            style="color: #000; font-size: 0.65rem"
                                            >ASTEROID TOGGLE</span
                                        >
                                    </div>
                                </div>
                                <!-- Root SVG Stub -->
                                <svg class="magi-svg-wire" aria-hidden="true">
                                    <polyline points="0,1 15,1" />
                                    <circle cx="0" cy="1" r="1.5" />
                                    <circle cx="15" cy="1" r="1.5" />
                                </svg>
                            </div>

                            <!-- Dynamic Asteroid List -->
                            <div
                                id="dataset-list-asteroids"
                                style="display: flex; flex-direction: column; gap: 8px"
                                role="group"
                                aria-label="Asteroid datasets"
                            ></div>
                        </div>

                        <!-- PLANETS & MOONS (RIGHT) -->
                        <div
                            id="dataset-list-planets"
                            class="magi-column right-col"
                            style="gap: 8px"
                            role="group"
                            aria-label="Planet and moon datasets"
                        ></div>
                    </div>
                </div>

                <!-- MOON FILTERS -->
                <div class="control-group">
                    <label id="moon-dist-label"
                        >MOON VIS (DIST AU)
                        <span id="dist-val" style="float: right; color: var(--theme-text-primary)"
                            >0.000 - 0.300</span
                        ></label
                    >
                    <div class="flex-row">
                        <input
                            type="range"
                            id="moon-dist-min"
                            min="0"
                            max="0.3"
                            step="0.001"
                            value="0"
                            aria-label="Minimum moon visibility distance in AU"
                            aria-describedby="moon-dist-label"
                        />
                        <input
                            type="range"
                            id="moon-dist-max"
                            min="0"
                            max="0.3"
                            step="0.001"
                            value="0.3"
                            aria-label="Maximum moon visibility distance in AU"
                            aria-describedby="moon-dist-label"
                        />
                    </div>

                    <label id="moon-size-label" style="margin-top: 10px"
                        >MOON VIS (SIZE KM)
                        <span id="size-val" style="float: right; color: var(--theme-text-primary)"
                            >0 - 5000</span
                        ></label
                    >
                    <div class="flex-row">
                        <input
                            type="range"
                            id="moon-size-min"
                            min="0"
                            max="5000"
                            step="1"
                            value="0"
                            aria-label="Minimum moon visibility size in kilometers"
                            aria-describedby="moon-size-label"
                        />
                        <input
                            type="range"
                            id="moon-size-max"
                            min="0"
                            max="5000"
                            step="1"
                            value="5000"
                            aria-label="Maximum moon visibility size in kilometers"
                            aria-describedby="moon-size-label"
                        />
                    </div>
                </div>
            </div>
            <div
                id="tab-settings"
                class="tab-content"
                role="tabpanel"
                aria-labelledby="btn-tab-settings"
                tabindex="0"
                hidden
                style="padding: 10px 5px"
            >
                <div class="control-group">
                    <label>UI COLOR THEME</label>
                    <div id="theme-grid" class="theme-grid"></div>
                </div>
            </div>
        </div>

        <div
            id="panel-right"
            class="panel"
            role="complementary"
            aria-labelledby="panel-right-heading"
        >
            <h2 id="panel-right-heading">Sensorium &middot; Telemetry</h2>
            <div id="telemetry-data" aria-live="polite" aria-atomic="true">
                <p>AWAITING DATA INPUT...</p>
            </div>
        </div>
        <div id="bottom-deck" role="region" aria-label="Chronometer and tactical controls">
            <div id="tactical-tools">
                <button
                    id="btn-measure"
                    class="tactical-tool-btn"
                    title="Toggle Spatial Ruler"
                    aria-label="Toggle spatial ruler"
                    aria-pressed="false"
                >
                    <div class="stby-content">
                        SPATIAL RULER <span style="color: #ffffff; margin-left: 8px">[ STBY ]</span>
                    </div>

                    <div class="actv-content">
                        <div class="marquee">
                            <span>ACTIVE • SPATIAL RULER • ACTIVE • SPATIAL RULER •&nbsp;</span>
                            <span>ACTIVE • SPATIAL RULER • ACTIVE • SPATIAL RULER •&nbsp;</span>
                        </div>
                    </div>
                </button>
                <button
                    id="btn-daylight-toggle"
                    class="icon-toggle-btn active"
                    title="Toggle Night-Side Overlay"
                    aria-label="Toggle night-side overlay"
                    aria-pressed="true"
                >
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="4" />
                        <line x1="12" y1="20" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="6.34" y2="6.34" />
                        <line x1="17.66" y1="17.66" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="4" y2="12" />
                        <line x1="20" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="6.34" y2="17.66" />
                        <line x1="17.66" y1="6.34" x2="19.78" y2="4.22" />
                    </svg>
                </button>
                <button
                    id="btn-ecliptic-toggle"
                    class="icon-toggle-btn ecliptic-toggle-btn"
                    title="Inclination Mode [Equatorial + Ecliptic]"
                    aria-label="Inclination Mode [Equatorial + Ecliptic]"
                    aria-pressed="false"
                >
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-20 12 12)" />
                        <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none" />
                    </svg>
                </button>
            </div>

            <div id="chronometer-shape">
                <div id="hud-credits" aria-hidden="true"></div>
                <div class="chrono-header">
                    <button
                        id="btn-live"
                        class="active"
                        aria-pressed="true"
                        aria-label="Jump to live time"
                    >
                        LIVE
                    </button>
                    <textarea
                        id="time-input-bottom"
                        aria-label="Simulation date and time, UTC. Edit and press Enter to apply."
                    ></textarea>
                    <button
                        id="btn-scan"
                        class="radar-btn"
                        aria-label="Scan for nearby asteroids"
                        aria-pressed="false"
                    >
                        <div class="ring outer"></div>
                        <div class="ring inner"></div>
                        <div class="sweep"></div>
                    </button>
                </div>

                <div class="throttle-container">
                    <button id="btn-time-rev" class="throttle-btn" aria-label="Decrease time scale">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <polygon points="11,19 11,5 2,12" />
                            <polygon points="22,19 22,5 13,12" />
                        </svg>
                    </button>
                    <button
                        id="btn-time-pause"
                        class="throttle-btn"
                        aria-label="Pause simulation time"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="6" y="4" width="4" height="16" />
                            <rect x="14" y="4" width="4" height="16" />
                        </svg>
                    </button>

                    <div id="chrono-slider-wrapper">
                        <canvas id="chrono-canvas" aria-hidden="true"></canvas>
                        <input
                            type="range"
                            id="time-slider"
                            min="0"
                            max="20"
                            step="1"
                            value="11"
                            aria-label="Time scale"
                            aria-describedby="throttle-label"
                            aria-valuetext="1 SEC / SEC"
                        />
                    </div>

                    <button id="btn-time-fwd" class="throttle-btn" aria-label="Increase time scale">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <polygon points="13,19 13,5 22,12" />
                            <polygon points="2,19 2,5 11,12" />
                        </svg>
                    </button>
                    <button
                        id="btn-time-1x"
                        class="throttle-btn"
                        aria-label="Set time scale to 1x real-time"
                    >
                        1X
                    </button>
                </div>
                <div id="throttle-label">1 SEC / SEC</div>
            </div>
        </div>
        <div id="canvas-container"></div>

        <button id="btn-tutorial" title="Open Tutorial" aria-label="Open tutorial">?</button>

        <div
            id="tutorial-overlay"
            role="dialog"
            aria-modal="true"
            aria-labelledby="tutorial-title"
            aria-describedby="tutorial-text"
        >
            <svg id="tutorial-svg" aria-hidden="true">
                <line id="tutorial-line" x1="0" y1="0" x2="0" y2="0" />
                <circle id="tutorial-dot" cx="0" cy="0" r="4" fill="#00ffff" />
            </svg>

            <div id="tutorial-box" tabindex="0">
                <h3 id="tutorial-title" aria-live="polite" aria-atomic="true">SYSTEM INIT</h3>
                <p id="tutorial-text" aria-live="polite" aria-atomic="true">
                    Welcome to the Heliochronicon.
                </p>
                <div class="tutorial-controls">
                    <span class="tutorial-hint"
                        >[CLICK, TAP, OR PRESS ENTER TO CONTINUE — ESC TO EXIT]</span
                    >
                    <button id="btn-skip-tutorial" aria-label="Skip tutorial">SKIP</button>
                </div>
            </div>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

        <script type="module" src="/js/main/main.js"></script>
    </body>
</html>
