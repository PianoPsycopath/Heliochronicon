<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 60" width="210" height="60">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Teko:wght@600&amp;display=swap');
            
            .btn-border {
                fill: none;
                stroke: #ff0000;
                stroke-width: 1px;
            }
            
            .hazard-bg {
                animation: hazard-slide 1s linear infinite; 
            }
            
            .marquee-text {
                font-family: 'Teko', sans-serif;
                font-size: 1.2rem;
                font-weight: bold;
                fill: #000000;
                letter-spacing: 1px;
                text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.4); 
            }
            
            .marquee-group {
                /* 4-second linear text loop */
                animation: text-scroll 4s linear infinite; 
            }

            /* Shift exactly one 40px tile */
            @keyframes hazard-slide {
                0% { transform: translateX(0); }
                100% { transform: translateX(-40px); } 
            }
            
            /* Shift exactly the width of one text chunk (150px) */
            @keyframes text-scroll {
                0% { transform: translateX(0); }
                100% { transform: translateX(-150px); } 
            }
        </style>
        
        <filter id="active-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComponentTransfer in="blur" result="glow">
                <feFuncA type="linear" slope="0.4"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode in="glow"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <clipPath id="btn-clip">
            <rect width="180" height="32" rx="2" />
        </clipPath>
        
        <pattern id="hazard-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <polygon points="0,0 20,0 0,20" fill="#ffcc00" />
            <polygon points="20,0 40,0 0,40 0,20" fill="#ff0000" />
            <polygon points="40,0 40,20 20,40 0,40" fill="#ffcc00" />
            <polygon points="40,20 40,40 20,40" fill="#ff0000" />
        </pattern>
    </defs>

    <g transform="translate(15, 14)">
        <!-- Outer Glow Shadow -->
        <rect width="180" height="32" rx="2" fill="none" stroke="#ff0000" stroke-width="2" filter="url(#active-glow)" />
        
        <!-- Clipped Container -->
        <g clip-path="url(#btn-clip)">
            
            <rect width="300" height="32" fill="url(#hazard-pattern)" class="hazard-bg" />
            
            <!-- Scrolling Marquee Text -->
            <g class="marquee-group">
                <!-- textLength enforces an exact width, preventing standard font rendering from ruining the math -->
                <text x="0" y="23" textLength="150" class="marquee-text">LIVE DEMO •  </text>
                <text x="150" y="23" textLength="150" class="marquee-text">LIVE DEMO  •  </text>
                <text x="300" y="23" textLength="150" class="marquee-text">LIVE DEMO  •  </text>
            </g>
        </g>
        
        <!-- Clean inner border -->
        <rect width="180" height="32" rx="2" class="btn-border" />
    </g>
</svg>
