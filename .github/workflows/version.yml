name: Auto Version

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest

    if: >
      !contains(github.event.head_commit.message, 'chore: bump version')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine version bump
        id: version
        shell: bash
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT"

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s")
          else
            COMMITS=$(git log --pretty=format:"%s")
          fi

          BUMP="none"
          PROMOTE="false"

          while IFS= read -r MESSAGE; do
            # Detects if the commit message ends with :beta
            if [[ "$MESSAGE" =~ :beta$ ]]; then
              PROMOTE="true"
            fi

            case "$MESSAGE" in
              *"BREAKING CHANGE"*|*!:*)
                BUMP="major"
                ;;
              feat:*)
                if [ "$BUMP" != "major" ]; then
                  BUMP="minor"
                fi
                ;;
              fix:*|perf:*|refactor:*|build:*|chore:*|ci:*|docs:*|style:*|test:*)
                if [ "$BUMP" = "none" ]; then
                  BUMP="patch"
                fi
                ;;
            esac
          done <<< "$COMMITS"

          if [ "$BUMP" = "none" ] && [ "$PROMOTE" = "false" ]; then
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Split CURRENT into base (e.g., 1.2.0) and pre-release (e.g., beta.1)
          IFS='-' read -r BASE PRE_PART <<< "$CURRENT"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          if [ -n "$PRE_PART" ]; then
            IFS='.' read -r PRE_NAME PRE_NUM <<< "$PRE_PART"
          else
            PRE_NAME="beta"
            PRE_NUM=-1
          fi

          if [ "$PROMOTE" = "true" ]; then
            # Drop the pre-release tag to finalize the stable version
            case "$BUMP" in
              major) NEXT="$((MAJOR + 1)).0.0" ;;
              minor) NEXT="$MAJOR.$((MINOR + 1)).0" ;;
              *)     NEXT="$MAJOR.$MINOR.$PATCH" ;;
            esac
          else
            # Continue incrementing the pre-release sequence
            case "$BUMP" in
              major) NEXT="$((MAJOR + 1)).0.0-$PRE_NAME.0" ;;
              minor) NEXT="$MAJOR.$((MINOR + 1)).0-$PRE_NAME.0" ;;
              patch)
                if [ "$PRE_NUM" -eq -1 ]; then
                  NEXT="$MAJOR.$MINOR.$((PATCH + 1))-$PRE_NAME.0"
                else
                  NEXT="$MAJOR.$MINOR.$PATCH-$PRE_NAME.$((PRE_NUM + 1))"
                fi
                ;;
            esac
          fi

          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "should_bump=true" >> "$GITHUB_OUTPUT"

      - name: Update package version
        if: steps.version.outputs.should_bump == 'true'
        run: |
          npm version "${{ steps.version.outputs.next }}" --no-git-tag-version

      - name: Create version bump pull request
        if: steps.version.outputs.should_bump == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "chore/auto-version-${{ steps.version.outputs.next }}"
          base: main
          commit-message: "chore: bump version to ${{ steps.version.outputs.next }}"
          title: "chore: bump version to ${{ steps.version.outputs.next }}"
          body: |
            Automated version bump.

            Detected Conventional Commit changes requiring a
            ${{ steps.version.outputs.next }} release.

            This PR updates:
            - `package.json`
            - `package-lock.json`

            No source-code changes are included.
          labels: |
            chore
            automated
