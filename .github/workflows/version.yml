name: Auto Version

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest

    # Ignore version-bump commits so merging the version PR does not
    # create another version PR.
    if: >
      !contains(github.event.head_commit.message, 'chore: bump version')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine version bump
        id: version
        shell: bash
        run: |
          CURRENT=$(node -p "require('./package.json').version")

          echo "Current version: $CURRENT"

          # Find commits since the last version tag.
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"%s")
          else
            COMMITS=$(git log --pretty=format:"%s")
          fi

          BUMP="none"

          while IFS= read -r MESSAGE; do
            case "$MESSAGE" in
              *"BREAKING CHANGE"*|feat!:*|fix!:*)
                BUMP="major"
                ;;
              feat:*)
                if [ "$BUMP" != "major" ]; then
                  BUMP="minor"
                fi
                ;;
              fix:*|perf:*)
                if [ "$BUMP" = "none" ]; then
                  BUMP="patch"
                fi
                ;;
            esac
          done <<< "$COMMITS"

          echo "Required bump: $BUMP"

          if [ "$BUMP" = "none" ]; then
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major)
              NEXT="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEXT="$MAJOR.$((MINOR + 1)).0"
              ;;
            patch)
              NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
              ;;
          esac

          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "should_bump=true" >> "$GITHUB_OUTPUT"

      - name: Update package version
        if: steps.version.outputs.should_bump == 'true'
        run: |
          npm version "${{ steps.version.outputs.next }}" --no-git-tag-version

      - name: Create version bump pull request
        if: steps.version.outputs.should_bump == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/auto-version-${{ steps.version.outputs.next }}
          base: main
          commit-message: chore: bump version to ${{ steps.version.outputs.next }}
          title: chore: bump version to ${{ steps.version.outputs.next }}
          body: |
            Automated version bump.

            Detected Conventional Commit changes requiring a
            ${{ steps.version.outputs.next }} release.

            This PR updates:
            - `package.json`
            - `package-lock.json`

            No source-code changes are included.
          labels: |
            chore
            automated